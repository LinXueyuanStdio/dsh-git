<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">dsh-git 的双半结构与安全边界</title>
  <desc id="arch-desc">一个 npm 包含两个半边。浏览器半注册官方右侧栏页签，只显示令牌尾 4 位，通过仅接受本机 loopback 的 /dsh-git/* 路由访问 host 半。host 半与 dsh 同进程，用到 ctx.subprocess、ctx.webServer、ctx.credentials、ctx.llm 四个接缝。host 半向下连接本地 git 仓库（实心节点表示已落地的本地提交），以及 GitHub REST（空心环表示远端尚未落地的提交）。</desc>

  <rect width="1200" height="420" rx="26" fill="#0f1115"/>
  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="#23262d"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <text x="64" y="64" font-size="26" font-weight="600" fill="#ebeef2">一个包，两个半边</text>
    <text x="64" y="96" font-size="18" fill="#8b949e">本地操作走仅 loopback 的 /dsh-git/* 路由；远端页签由 host 半代理打 GitHub REST。</text>
  </g>

  <!-- ============ 浏览器半 ============ -->
  <g id="browser-half">
    <rect x="64" y="150" width="250" height="180" rx="12" fill="#14161b" stroke="#23262d"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
      <text x="84" y="186" font-size="20" font-weight="600" fill="#ebeef2">浏览器半</text>
      <text x="84" y="212" font-size="18" fill="#61666b">官方右侧栏 Tab</text>
      <text x="84" y="252" font-size="18" fill="#8b949e">· 六个页签</text>
      <text x="84" y="282" font-size="18" fill="#8b949e">· dsh.client 声明</text>
      <text x="84" y="312" font-size="18" fill="#8b949e">· 只看令牌尾 4 位</text>
    </g>
  </g>

  <!-- ============ host 半 ============ -->
  <g id="host-half">
    <rect x="430" y="120" width="360" height="240" rx="12" fill="#14161b" stroke="#4d6bfe"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
      <text x="450" y="156" font-size="20" font-weight="600" fill="#ebeef2">host 半</text>
      <text x="450" y="182" font-size="18" fill="#61666b">与 dsh 同进程</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7aaaff">
      <text x="450" y="224">ctx.subprocess</text>
      <text x="450" y="262">ctx.webServer</text>
      <text x="450" y="300">ctx.credentials</text>
      <text x="450" y="338">ctx.llm</text>
    </g>
  </g>

  <!-- ============ 右：两个目标，用 icon.svg 的节点语言区分本地 / 远端 ============ -->
  <g id="targets">
    <rect x="920" y="140" width="216" height="88" rx="12" fill="#14161b" stroke="#23262d"/>
    <g transform="translate(942 176) scale(0.9)" fill="#4d6bfe">
      <circle cx="7.5" cy="5" r="2.35"/>
      <circle cx="7.5" cy="19" r="2.35"/>
    </g>
    <g transform="translate(942 176) scale(0.9)" fill="none" stroke="#4d6bfe" stroke-width="2" stroke-linecap="round">
      <path d="M7.5 5.3v13.4"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
      <text x="980" y="180" font-size="20" font-weight="600" fill="#ebeef2">本地 git</text>
      <text x="980" y="206" font-size="18" fill="#8b949e">你添加过的仓库</text>
    </g>

    <rect x="920" y="252" width="216" height="88" rx="12" fill="#14161b" stroke="#23262d"/>
    <circle cx="951" cy="296" r="6.4" fill="none" stroke="#7aaaff" stroke-width="2.4"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
      <text x="980" y="292" font-size="20" font-weight="600" fill="#ebeef2">GitHub REST</text>
      <text x="980" y="318" font-size="18" fill="#8b949e">四个远端页签</text>
    </g>
  </g>

  <!-- ============ 连线 ============ -->
  <g stroke="#43454a" stroke-width="1.6">
    <line x1="314" y1="240" x2="421" y2="240"/>
    <line x1="790" y1="184" x2="911" y2="184"/>
    <line x1="790" y1="296" x2="911" y2="296"/>
  </g>
  <g fill="#43454a">
    <path d="M430 240l-9 -5v10z"/>
    <path d="M920 184l-9 -5v10z"/>
    <path d="M920 296l-9 -5v10z"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <text x="372" y="220" font-size="18" fill="#7aaaff" text-anchor="middle">仅 loopback</text>
    <text x="372" y="270" font-size="18" fill="#61666b" text-anchor="middle">远程 403</text>
    <text x="855" y="170" font-size="18" fill="#8b949e" text-anchor="middle">git 子进程</text>
    <text x="855" y="282" font-size="18" fill="#8b949e" text-anchor="middle">HTTPS + 令牌</text>
    <text x="64" y="388" font-size="18" fill="#61666b">实心节点 = 已落地的本地提交；空心环 = 远端尚未落地（节点语言取自本仓库 icon.svg）</text>
  </g>
</svg>
