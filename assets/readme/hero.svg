<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">dsh-git —— DeepSeek Harness 官方右侧栏里的本地 Git 工作台</title>
  <desc id="hero-desc">左侧是标题与一句话说明：把本地 Git 工作台和 GitHub 远端页签一起装进 DeepSeek Harness 的官方右侧栏，提交信息由 DSH 模型列表里的模型生成。右侧是 DSH 窗口的结构示意（非实机截图）：主对话区在左，dsh-git 面板占据右侧栏，面板内有仓库下拉、同步工具栏、Changes/History 等页签、文件列表与提交区，提交区带一个「生成」按钮。</desc>

  <!-- 画布：自带深色底，保证在 GitHub 亮/暗两种主题下都可读 -->
  <rect width="1200" height="440" rx="26" fill="#0f1115"/>
  <rect x="1" y="1" width="1198" height="438" rx="25" fill="none" stroke="#23262d"/>

  <!-- ================= 左侧：身份 ================= -->
  <!-- 品牌标记（取自仓库 icon.svg：实心节点=本地提交，空心环=远端未落地提交） -->
  <g transform="translate(64 54) scale(2)" fill="none" stroke="#4d6bfe" stroke-width="2" stroke-linecap="round">
    <path d="M7.5 5.3v13.4"/>
    <path d="M7.5 11.8c0 2.2 1.6 3.8 3.8 3.8h1.5"/>
  </g>
  <g transform="translate(64 54) scale(2)" fill="#4d6bfe">
    <circle cx="7.5" cy="5" r="2.35"/>
    <circle cx="7.5" cy="19" r="2.35"/>
  </g>
  <circle cx="95" cy="85.2" r="4.1" fill="none" stroke="#4d6bfe" stroke-width="1.7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <text x="130" y="74" font-size="18" fill="#7aaaff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dsh web / Desktop 插件 · 官方右侧栏</text>
    <text x="128" y="122" font-size="54" font-weight="700" fill="#ebeef2" letter-spacing="-1">dsh-git</text>

    <text x="64" y="186" font-size="24" fill="#ebeef2">本地 Git 工作台 + GitHub 远端页签，</text>
    <text x="64" y="220" font-size="24" fill="#ebeef2">一起装进 DSH 的官方右侧栏。</text>
    <text x="64" y="258" font-size="20" fill="#8b949e">提交信息由 DSH 模型生成，不用 Copilot。</text>
  </g>

  <text x="64" y="356" font-size="17" fill="#61666b"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@linxueyuan/dsh-git · MIT · 本地 git 只走 loopback</text>

  <!-- ================= 右侧：它住在哪（结构示意） ================= -->
  <g id="window">
    <rect x="632" y="56" width="504" height="328" rx="14" fill="#14161b" stroke="#23262d"/>
    <!-- 宿主主区域（左）：只示意，不抢戏 -->
    <g fill="#1c1f26">
      <rect x="648" y="88" width="140" height="10" rx="5"/>
      <rect x="648" y="112" width="100" height="10" rx="5"/>
      <rect x="648" y="136" width="160" height="10" rx="5"/>
    </g>
    <rect x="648" y="320" width="168" height="32" rx="16" fill="#14161b" stroke="#23262d"/>
    <text x="732" y="341" font-size="16" fill="#43454a" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">对话 / 主区域</text>
    <line x1="832" y1="56" x2="832" y2="384" stroke="#23262d"/>
  </g>

  <g id="panel" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <!-- 面板头：仓库下拉 + 同步状态 -->
    <g transform="translate(848 64) scale(0.75)" fill="none" stroke="#4d6bfe" stroke-width="2" stroke-linecap="round">
      <path d="M7.5 5.3v13.4"/>
      <path d="M7.5 11.8c0 2.2 1.6 3.8 3.8 3.8h1.5"/>
    </g>
    <g transform="translate(848 64) scale(0.75)" fill="#4d6bfe">
      <circle cx="7.5" cy="5" r="2.35"/>
      <circle cx="7.5" cy="19" r="2.35"/>
    </g>
    <text x="870" y="80" font-size="18" font-weight="600" fill="#ebeef2">dsh-git</text>
    <path d="M936 74l5 5 5-5z" fill="#8b949e"/>
    <!-- 上/下箭头用图形画，避免字体缺字 -->
    <path d="M1046 72l-5 7h10z" fill="#2da44e"/>
    <text x="1054" y="80" font-size="16" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2</text>
    <path d="M1076 80l5-7h-10z" fill="#d73a49"/>
    <text x="1084" y="80" font-size="16" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text>
    <circle cx="1112" cy="75" r="7" fill="none" stroke="#61666b"/>
    <circle cx="1112" cy="75" r="2.2" fill="#61666b"/>
    <line x1="832" y1="96" x2="1136" y2="96" stroke="#1c1f26"/>

    <!-- 工具栏：分支 + 同步 -->
    <rect x="848" y="104" width="120" height="26" rx="6" fill="#1a1d23" stroke="#23262d"/>
    <text x="858" y="122" font-size="16" fill="#ebeef2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">feature/ui</text>
    <path d="M954 114l4 4 4-4z" fill="#8b949e"/>
    <rect x="1032" y="104" width="88" height="26" rx="6" fill="#1a1d23" stroke="#23262d"/>
    <text x="1076" y="122" font-size="16" fill="#ebeef2" text-anchor="middle">同步</text>
    <line x1="832" y1="140" x2="1136" y2="140" stroke="#1c1f26"/>

    <!-- 页签（只画前两个 + 省略号：完整清单由 section-tabs.svg 承担，那里的字足够大） -->
    <text x="848" y="164" font-size="18" font-weight="600" fill="#ebeef2">Changes</text>
    <rect x="848" y="172" width="70" height="2" fill="#4d6bfe"/>
    <text x="936" y="164" font-size="18" fill="#61666b">History</text>
    <text x="1010" y="164" font-size="18" fill="#61666b">…</text>
    <line x1="832" y1="184" x2="1136" y2="184" stroke="#1c1f26"/>

    <!-- 文件列表 -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <text x="848" y="214" fill="#2da44e">A</text>
      <text x="870" y="214" fill="#ebeef2">assets/readme/hero.svg</text>
      <text x="848" y="250" fill="#8b949e">M</text>
      <text x="870" y="250" fill="#ebeef2">src/client/styles.ts</text>
      <text x="1116" y="250" fill="#2da44e" text-anchor="end">+12</text>
      <text x="848" y="286" fill="#8b949e">M</text>
      <text x="870" y="286" fill="#ebeef2">README.md</text>
      <text x="1116" y="286" fill="#d73a49" text-anchor="end">-3</text>
    </g>
    <line x1="832" y1="302" x2="1136" y2="302" stroke="#1c1f26"/>

    <!-- 提交区：一句话 + 生成 + 提交 -->
    <rect x="848" y="314" width="272" height="56" rx="8" fill="#14161b" stroke="#23262d"/>
    <text x="862" y="336" font-size="16" fill="#61666b">更新 README 结构示意</text>
    <rect x="862" y="344" width="80" height="20" rx="6" fill="#4d6bfe"/>
    <path d="M872 350l1.6 3.4 3.4 1.6-3.4 1.6-1.6 3.4-1.6-3.4-3.4-1.6 3.4-1.6z" fill="#ffffff"/>
    <text x="884" y="359" font-size="16" fill="#ffffff">生成</text>
    <rect x="1048" y="344" width="60" height="20" rx="6" fill="#1a1d23" stroke="#23262d"/>
    <text x="1078" y="359" font-size="16" fill="#ebeef2" text-anchor="middle">提交</text>
  </g>
</svg>
