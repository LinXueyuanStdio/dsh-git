name: Release

# 打 `v*` tag 才发;版本号与 tag 必须一致(下一步会硬校验)。
on:
  push:
    tags: ['v*']

permissions:
  # 建 GitHub Release 要写 contents;npm 的 --provenance 要 id-token(参考稿里本来就声明了)。
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 发布前跑**和 CI 完全相同**的那条链:没构建过、没验过可用性的树不许发出去。
      # 判据与 CI 一致,只覆盖**发布物本身**(构建 + 产物语法 + 包可用性);
      # 源码卫生那一族闸门(`npm run check:static`)是本地工具,不阻塞发布 ——
      # 否则带着棘轮债的仓库将永远发不出新版本,而它们与「装上能不能用」无关。
      - name: 发布物检查(构建 + 产物语法 + 包可用性)
        run: |
          set -euo pipefail
          npm run build
          npm run check
          node scripts/verify-plugin.mjs

      # tag 与 package.json 不一致是最容易犯的发布错:它会安静地发错版本号。
      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} 与 package.json 的 ${pkg} 不一致 —— 先对齐版本号再打 tag"
            exit 1
          fi

      # `--provenance` 需要上面的 id-token: write 与**公开**仓库;若环境不允许,去掉这个参数即可。
      - name: 发布到 npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
