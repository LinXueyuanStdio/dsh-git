name: Release

# **手动触发**:Actions 页面选本 workflow → Run workflow。
# 要发某个 tag 的版本,在 "Use workflow from" 里选那个 `vX.Y.Z` tag(或填下面的 tag 输入框)。
#
# 为什么不再监听 tag push —— 打 tag 是「标记」,发布是「动作」,绑在一起有两个坑:
#   1. 想给**已经发布过**的版本补一个 tag(或补建 GitHub Release)时,会意外触发一次
#      必然失败的发布(版本号已存在);
#   2. 发布失败后无法重试 —— 同一个 tag 再 push 不会再次触发 workflow。
# 需要「自动发布」时把上面换成 `on: push: tags: ['v*']` 即可,其余步骤不用动。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag(vX.Y.Z);留空则用当前 ref 名(在 tag 上手动运行时就是那个 tag)'
        required: false
        type: string

permissions:
  # 建 GitHub Release 要写 contents;npm 的 --provenance 要 id-token。
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 —— GitHub Release 的自动 release notes 要与上一个 tag 比对。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 发布前跑**和 CI 完全相同**的那条链:没构建过、没验过可用性的树不许发出去。
      # 判据与 CI 一致,只覆盖**发布物本身**(构建 + 产物语法 + 包可用性);
      # 源码卫生那一族闸门(`npm run check:static`)是本地工具,不阻塞发布 ——
      # 否则带着棘轮债的仓库将永远发不出新版本,而它们与「装上能不能用」无关。
      - name: 发布物检查(构建 + 产物语法 + 包可用性)
        run: |
          set -euo pipefail
          npm run build
          npm run check
          node scripts/verify-plugin.mjs

      # tag 与 package.json 不一致是最容易犯的发布错:它会安静地发错版本号。
      # 手动触发时两个来源都接受:输入框里的 tag,或当前 ref(tag 上手动运行)。
      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          case "$tag" in
            v*) ;;
            *) echo "::error::'$tag' 不是 v* 形式的 tag —— 请选一个 vX.Y.Z tag,或在 tag 输入框里填它"; exit 1 ;;
          esac
          want="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$want" != "$pkg" ]; then
            echo "::error::tag v${want} 与 package.json 的 ${pkg} 不一致 —— 先对齐版本号再发布"
            exit 1
          fi
          echo "tag v${want} 与 package.json 一致,继续。"

      # ⚠️ **Trusted Publishing(OIDC)要求 npm ≥ 11.5.1**,而本 job 的 node 22 自带的是
      # npm **10.9.9**(2026-10-11 实测 runner:node v22.23.3)。不升级这一步,配好了
      # npm 侧的 Trusted Publisher 也照样以 `ENEEDAUTH` 失败(实测:上面两步全绿、只差凭据)。
      # 放在发布步骤**之前、检查步骤之后**:升级 npm 不该改变「发布物检查」的读数。
      - name: npm ≥ 11.5.1(Trusted Publishing 的最低版本)
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          npm --version

      # **Trusted Publisher 的比对依据**。registry 拒绝时不告诉你是哪一项不匹配,只会回一句
      # `403 OIDC permission denied for this action`(2026-10-12 实测两次:tag ref 与 main ref
      # 都一样),所以把 registry 真正会比的声明打出来 —— npm 包 Settings → Trusted Publisher
      # 那三个字段就是与 `repository` / `workflow_ref` 的文件名部分 / `environment` 对表。
      # ⚠️ 只打印**声明**,不打印令牌本身(令牌在有效期内仍可被兑换)。
      - name: 记下 OIDC 声明(Trusted Publisher 的比对依据)
        run: |
          set -euo pipefail
          node -e '
            (async () => {
              const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=npm:registry.npmjs.org";
              const res = await fetch(url, { headers: { authorization: "bearer " + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
              const { value } = await res.json();
              const claims = JSON.parse(Buffer.from(value.split(".")[1], "base64url").toString("utf8"));
              for (const key of ["sub", "repository", "repository_owner", "repository_id", "workflow_ref", "job_workflow_ref", "environment", "ref", "event_name", "aud"]) {
                console.log(`${key} = ${claims[key] ?? "(缺席)"}`);
              }
            })()
          '

      # `--provenance` 需要上面的 id-token: write 与**公开**仓库(本仓库已公开)。
      #
      # 两条凭据路径,优先级与改前**逐字相同**:配了 `NPM_TOKEN` 就用它;没配就走
      # OIDC(npm 包的 Settings → Trusted Publisher 里登记本仓库 + 本 workflow 文件名,
      # 并在 `Allowed actions` 里**显式勾上直接 `npm publish`** —— 2026-09-03 之后新建的
      # binding 默认只允许 `npm stage publish`,不勾就是 `403 OIDC permission denied
      # for this action`,registry 不告诉你是哪一项;2026-10-12 实测踩过)。
      # ⚠️ **不能让 `NODE_AUTH_TOKEN` 以空串的形式存在**:npm 会把"已设置"当真、不再尝试
      # OIDC ⇒ 又回到 ENEEDAUTH(这正是 2026-10-11 那次运行失败的样子:仓库里没有任何
      # secret,而 workflow 无条件导出了一个空 token)。所以这里只在**非空**时导出。
      #
      # ⚠️ 如果 npm 把这次发布转成**暂存发布**(账号侧要求 proof-of-presence 时会发生),
      # 这一步会成功但版本不会立刻对外可见 —— 需要你本机用 npm 12 批准:
      #     npm stage list @linxueyuan/dsh-git
      #     npm stage approve <stage-id>      # 会提示 2FA
      - name: 发布到 npm
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "::add-mask::${NPM_TOKEN}"
            export NODE_AUTH_TOKEN="${NPM_TOKEN}"
            echo "凭据:npm Granular Access Token(secrets.NPM_TOKEN)"
          else
            echo "凭据:npm Trusted Publishing(OIDC)—— 仓库里没有 NPM_TOKEN"
          fi
          npm publish --access public --provenance
          echo "已发布 @linxueyuan/dsh-git@$(node -p "require('./package.json').version")"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
