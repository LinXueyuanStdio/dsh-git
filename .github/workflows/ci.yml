name: CI

# 闸门清单**不写在这里**:`scripts/check-all.mjs` 自动发现 `scripts/check-*.mjs`
# (见 docs/static-gates.md),新增一条闸门不需要改这个文件 ——
# 「没有闸门的工具 = 没人跑的工具」,反过来说,闸门清单也**只能有一份**。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一条 ref 上只留最新一次运行:闸门判的是「当前这条提交」,
# 让已过时的运行继续跑只会烧额度并制造假红灯。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 包管理器是 **npm**(package-lock.json 是唯一事实源);Node 22 与
      # devDependencies 里的 @types/node ^22 对齐。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 `npm ci` 而不是 `npm install`:lockfile 与 package.json 不一致时
      # 必须**红**,而不是悄悄改 lockfile 把 CI 弄绿。
      - name: 安装依赖
        run: npm ci

      # 构建**自包含**:上游样式表已移植进仓库(`src/client/scss/upstream/**`,183 个
      # 文件,与 `references/desktop/app/styles/**` 逐字节相同),所以检出里**没有**
      # `references/`(.gitignore:221 排除)也**没有** `vendor/`(:224 排除)照样构建。
      - name: 构建(esbuild:lib/index.js + lib/client.js)
        run: npm run build

      - name: 产物语法检查
        run: npm run check

      # 一条命令跑齐所有静态闸门(check-all 自动发现,顺序执行并汇总)。
      # 退出码契约:0 = 通过(允许带**已登记**的棘轮债务)、1 = 有**未登记**缺陷、
      # 2 = 跳过(输入读不到)。
      #
      # 注意 `scripts/verify-mirror.mjs` **不在这里**:它判「我们与上游逐字节相同」,
      # 需要上游 checkout,而 `/references/` 被 .gitignore 排除 ⇒ 它已从 check-* 集合
      # 移出,改由本机显式调用(否则在 CI 里只会是假绿)。
      - name: 静态闸门(scripts/check-*.mjs 全跑齐)
        run: npm run check:static

      # 上游 Desktop `ci.yml:73-74`「Ensure a clean working directory」的等价判据:
      # 重跑一次构建,生成物必须**逐字节**一致(时间戳已规范化)——
      # 这条覆盖「生成物与源码不同步」这一整类静默失败。
      #
      # `--force`:那条「检测到别的构建在跑就跳过」的保护是给本地多会话工作用的;
      # 在专用 runner 上它只会把一个真闸门变成 SKIP(退出码 2 ⇒ 整个步骤红)。
      # `--rebuild`(而不是清单比对模式)比的是**这棵树自己**的源码与产物 ⇒
      # 判据是「可复现」,不是「与某个记录值相等」。
      - name: 干净工作区(重跑构建,生成物必须逐字节一致)
        run: node scripts/check-generated.mjs --rebuild --force
