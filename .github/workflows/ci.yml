name: CI

# 这条 CI 只回答一个问题:**这个插件构建得出来、装得上、加载得起来吗**。
#
# 它刻意**不**跑 `npm run check:static` 那一族(闭包配方、未接线祖先、lint、类型、
# 生成物摘要…)。那些盯的是「这个仓库自己怎么写的」,其中一部分是长期棘轮债,
# 与「用户装上能不能用」无关 —— 让它们拦下每一次推送,等于让公开仓库的徽章常年是红的,
# 而红徽章什么信息都传递不了。它们仍然在本地可用:
#
#     npm run check:static              # 一条命令跑齐所有静态闸门
#     npm run check:generated:rebuild   # 重跑构建,生成物逐字节比对
#
# 这里跑的每一步都是**发布物本身**:构建 → 产物语法 → 包可用性。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一条 ref 上只留最新一次运行:判的是「当前这条提交」,
# 让已过时的运行继续跑只会烧额度并制造假红灯。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 包管理器是 **npm**(package-lock.json 是唯一事实源);Node 22 与
      # devDependencies 里的 @types/node ^22 对齐。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 `npm ci` 而不是 `npm install`:lockfile 与 package.json 不一致时
      # 必须**红**,而不是悄悄改 lockfile 把 CI 弄绿。
      # (`.npmrc` 里关掉了严格 peer 解析 —— 原因见该文件的注释。)
      - name: 安装依赖
        run: npm ci

      # 构建**自包含**:上游样式表已移植进仓库(`src/client/scss/upstream/**`,183 个
      # 文件,与 `references/desktop/app/styles/**` 逐字节相同),所以检出里**没有**
      # `references/`(.gitignore 排除)也**没有** `vendor/` 照样构建。
      - name: 构建(esbuild:lib/index.js + lib/client.js)
        run: npm run build

      - name: 产物语法检查
        run: npm run check

      # 四件与「装上能不能用」直接相关的事:
      #   1. package.json 里的 dsh.bundle.patch / exports 指向的文件真的存在;
      #   2. lib/client.js 的 ModuleLoader id == 包名(Desktop 就是这么校验的),
      #      且 cordis.patch.yml 指向本包;
      #   3. 两个产物里的**外部 import/require** 都在 dependencies/peerDependencies 里
      #      —— 这条抓「本地 node_modules 齐全、用户机器上却加载失败」;
      #   4. `npm pack` 的内容完整(两个入口 + patch + 图标 + README + LICENSE)
      #      且**不含 sourcemap**(map 内嵌全部源码,只该留在本机)。
      - name: 插件可用性(包完整 / 宿主可加载 / 运行时依赖已声明 / 不含源码)
        run: node scripts/verify-plugin.mjs
